# docker-compose.yml — GLM 5.3 Flash Uncensored (FP8) on 4xH200-class hardware.
#
#   hf download dealignai/GLM-5.3-Flash-UNCENSORED-FP8 \
#       --local-dir ./weights/GLM-5.3-Flash-UNCENSORED-FP8
#   docker compose up
#   ./smoke_test.sh
#
# For NVFP4 (1xB200 / 2xH200) swap the image tag to one with Blackwell NVFP4
# kernels and point --model at dealignai/GLM-5.3-Flash-UNCENSORED-NVFP4.
services:
  glm:
    image: vllm/vllm-openai:latest
    container_name: glm53flash
    restart: unless-stopped
    ipc: host
    shm_size: "32gb"
    ports:
      - "8000:8000"
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - VLLM_NO_USAGE_STATS=1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    volumes:
      - ./weights/GLM-5.3-Flash-UNCENSORED-FP8:/models/glm53flash:ro
      - ${HF_CACHE:-~/.cache/huggingface}:/root/.cache/huggingface
    command:
      - --model=/models/glm53flash
      - --served-model-name=glm-5.3-flash-uncensored
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=4
      - --max-model-len=131072
      - --gpu-memory-utilization=0.90
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      - --reasoning-parser=glm45
      - '--speculative-config={"method":"mtp","num_speculative_tokens":1}'
      - '--limit-mm-per-prompt={"image":4,"video":1}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
